[project]
name = "beebreak-server"
version = "0.1.0"
description = "Beebreak hosted service: accounts, sign-in and realtime connection"
authors = [
    { name = "EDantes", email = "253079570+edmonddantes99@users.noreply.github.com" }
]
license = "Apache-2.0"
# Upper bound = the Python CI tests (.python-version). Widen it only together
# with CI.
requires-python = ">=3.12,<3.13"
dependencies = [
    "beebreak-shared",
    "alembic==1.20.0",
    "fastapi==0.141.1",
    # The binary wheel is a dev/M3 convenience; M6 decides binary vs. system libpq
    # for the production image.
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.1",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
beebreak-server = "beebreak_server.cli:main"
beebreak-admin = "beebreak_server.admin:main"

[tool.uv.sources]
beebreak-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
