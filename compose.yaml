# Local development stack: Postgres, Mailpit (catches sign-in email) and the
# server. Every published port is bound to 127.0.0.1 only.
#
#   cp .env.example .env   # then fill in the secrets
#   docker compose up --build
#   docker compose exec server beebreak-admin invite create you@example.com
#
# Mailpit web UI: http://127.0.0.1:8025
#
# Base images are pinned by digest; the comment names the tag.

services:
  postgres:
    # postgres:17
    image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: beebreak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: beebreak
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebreak -d beebreak"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # axllent/mailpit:v1.27
    image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # One-shot: applies migrations, then exits (the image CMD only serves).
  migrate:
    build: &server-build
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["beebreak-server", "migrate"]
    environment:
      BEEBREAK_DATABASE_URL: postgresql+psycopg://beebreak:${POSTGRES_PASSWORD}@postgres:5432/beebreak
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build: *server-build
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      BEEBREAK_DATABASE_URL: postgresql+psycopg://beebreak:${POSTGRES_PASSWORD}@postgres:5432/beebreak
      BEEBREAK_SERVER_SECRET: ${BEEBREAK_SERVER_SECRET:?set BEEBREAK_SERVER_SECRET in .env}
      BEEBREAK_SMTP_HOST: mailpit
      BEEBREAK_SMTP_PORT: "1025"
      BEEBREAK_GITHUB_CLIENT_ID: ${BEEBREAK_GITHUB_CLIENT_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  postgres-data:
