[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# Keep the formatter out of Markdown code blocks in the spec.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "breakroom_agent_bridge",
    "breakroom_companion",
    "breakroom_shared",
    "tests",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
