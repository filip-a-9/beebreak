[project]
name = "beebreak-shared"
version = "0.1.0"
description = "Versioned contracts shared by Beebreak components"
readme = "README.md"
authors = [
    { name = "EDantes", email = "253079570+edmonddantes99@users.noreply.github.com" }
]
license = "Apache-2.0"
# Upper bound = the Python CI tests (.python-version). Widen it only together
# with CI.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
