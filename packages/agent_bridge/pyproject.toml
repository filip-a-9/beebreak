[project]
name = "beebreak-agent-bridge"
version = "0.1.0"
description = "Claude Code hook reducer, MCP server, and IPC client for Beebreak"
authors = [
    { name = "EDantes", email = "253079570+edmonddantes99@users.noreply.github.com" }
]
license = "Apache-2.0"
# Upper bound = the Python CI tests (.python-version). Widen it only together
# with CI.
requires-python = ">=3.12,<3.13"
dependencies = [
    "beebreak-shared",
    "mcp==2.3.0",
]

[project.scripts]
beebreak-hook = "beebreak_agent_bridge.hook:main"
beebreak-mcp = "beebreak_agent_bridge.mcp_server:main"

[tool.uv.sources]
beebreak-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
