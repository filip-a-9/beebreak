# Production-shaped stack: Caddy (TLS) -> server -> Postgres.
#
#   cp .env.example .env     # then replace EVERY placeholder
#   docker compose -f compose.prod.yaml up -d --build
#
# Only Caddy publishes ports (80, 443). The server and Postgres are reachable
# only from inside the compose networks.
#
# ONE server container only. The realtime hub, presence, rate limiters and the
# matchmaker lock live in the server process; a second replica (or worker)
# would split users between processes and break matching. Do not scale it.
#
# Base images are pinned by digest; the comment names the tag. To bump one:
# `docker pull <tag>`, copy the new digest, change both.

# Docker's default json-file driver never rotates; cap every service's logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    logging: *logging
    # postgres:17
    image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: beebreak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: beebreak
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebreak -d beebreak"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies migrations, then exits. `server` starts only after it
  # finished successfully.
  migrate:
    logging: *logging
    # Runs the image `server` builds. No `build:` here, so it is built once;
    # `never` makes compose wait for that local build instead of pulling.
    image: beebreak-server:prod
    pull_policy: never
    command: ["beebreak-server", "migrate"]
    environment:
      BEEBREAK_DATABASE_URL: postgresql+psycopg://beebreak:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/beebreak
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  server:
    logging: *logging
    image: beebreak-server:prod
    # Always build locally; never look this name up in a registry.
    pull_policy: build
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    # Every BEEBREAK_* tunable set in .env (limits, timeouts, retention) reaches
    # the server; unset ones keep their code defaults. The `environment:` values
    # below take precedence over this file, so they cannot be overridden here.
    # Optional so `compose config` works without one; the required values
    # still fail fast through their `:?` checks. Needs Compose 2.24+.
    env_file:
      - path: .env
        required: false
    environment:
      BEEBREAK_DATABASE_URL: postgresql+psycopg://beebreak:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/beebreak
      BEEBREAK_SERVER_SECRET: ${BEEBREAK_SERVER_SECRET:?set BEEBREAK_SERVER_SECRET in .env}
      # Email codes are off when BEEBREAK_SMTP_HOST is empty (GitHub-only); the
      # server then needs BEEBREAK_GITHUB_CLIENT_ID and ignores the SMTP values.
      BEEBREAK_SMTP_HOST: ${BEEBREAK_SMTP_HOST:-}
      BEEBREAK_SMTP_PORT: ${BEEBREAK_SMTP_PORT:-587}
      BEEBREAK_SMTP_USERNAME: ${BEEBREAK_SMTP_USERNAME:-}
      BEEBREAK_SMTP_PASSWORD: ${BEEBREAK_SMTP_PASSWORD:-}
      BEEBREAK_SMTP_TLS: ${BEEBREAK_SMTP_TLS:-starttls}
      BEEBREAK_MAIL_FROM: ${BEEBREAK_MAIL_FROM:-Beebreak <no-reply@beebreak.local>}
      BEEBREAK_GITHUB_CLIENT_ID: ${BEEBREAK_GITHUB_CLIENT_ID:-}
      # Believe X-Forwarded-For only from Caddy's fixed address (not the whole
      # subnet, which also holds the Docker gateway at .1).
      BEEBREAK_TRUSTED_PROXIES: 172.29.7.10/32
      # One JSON object per line on stderr (`docker compose logs server`).
      BEEBREAK_LOG_FORMAT: json
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, edge]
    # No `ports:` on purpose: only Caddy is reachable from outside.
    healthcheck:
      # The slim image has no curl.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  caddy:
    logging: *logging
    # caddy:2.10
    image: caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    environment:
      BEEBREAK_PUBLIC_HOST: ${BEEBREAK_PUBLIC_HOST:?set BEEBREAK_PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates and the private CA live here
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.29.7.10
    restart: unless-stopped

networks:
  # Postgres is reachable only here; `internal` also removes its internet access.
  backend:
    internal: true
  # Caddy and the server. A fixed subnet lets Caddy keep a fixed address, which the server trusts.
  edge:
    ipam:
      config:
        - subnet: 172.29.7.0/24

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
